<!DOCTYPE html>
<html lang="es"> 
<head> 
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Billfold Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;
  --sf:#ffffff;
  --tx:#1f2124;
  --mu:#6b7280;
  --ln:#e6e8ec;
  --ac:#fdda24;
  --gold1:#ffe66d;
  --gold2:#f5c518;
  --gold3:#c99700;
  --ok:#00b37e;
  --bad:#dc2626;
  --dk:#1f2124;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  height:100%;
  background:var(--bg);
  color:var(--tx);
  font:400 13.5px/1.45 "Inter",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tx);outline-offset:2px}

.ph{
  position:relative;
  max-width:420px;
  height:100%;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg);
}
@media(min-width:500px){
  body{display:grid;place-items:center;background:#dfe3ea}
  .ph{
    width:392px;
    height:min(844px,94vh);
    border-radius:42px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.35),0 0 0 10px #1f1e1d;
  }
}

#v{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:98px}
#v::-webkit-scrollbar{display:none}

h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
small{font-size:11.5px;color:var(--mu);font-weight:400}

.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec{padding:0 20px;margin-top:20px}

/* Encabezado limpio */
.hd{
  background:var(--sf);
  padding:14px 20px 20px;
  border-bottom:1px solid var(--ln);
}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lgo{display:flex;align-items:center;gap:11px;min-width:0}
.lgo>div:last-child{min-width:0}
.lgo h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-acts{display:flex;align-items:center;gap:8px;flex:none}
.ib{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--bg);
  border:1px solid var(--ln);
  display:grid;
  place-items:center;
  transition:transform .15s,background .15s;
}
.ib:active{transform:scale(.94)}
.ib.adm-on{background:var(--tx);color:var(--ac);border-color:var(--tx)}
.bell{position:relative}
.bn{
  position:absolute;
  top:-3px;
  right:-3px;
  min-width:17px;
  height:17px;
  border-radius:9px;
  background:#e5334b;
  color:#fff;
  font-size:10px;
  font-weight:600;
  display:grid;
  place-items:center;
  padding:0 4px;
  box-shadow:0 2px 6px rgba(229,51,75,.35);
}

/* Resumen global sobrio */
.gl{
  background:var(--sf);
  color:var(--tx);
  border:1px solid var(--ln);
  border-radius:20px;
  padding:16px;
}
.tag{
  font-size:11px;
  font-weight:500;
  color:var(--tx);
  padding:3px 10px;
  border-radius:99px;
  border:1px solid var(--ln);
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--d,var(--ok))}
.gb{font-size:26px;font-weight:600;color:var(--tx);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rt{text-align:right}
.rt b{display:block;font-weight:500;font-variant-numeric:tabular-nums}
.sp{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--ln);margin:12px 0 7px}
.sp i{background:var(--tx);transition:width .5s ease}

/* Alerta */
.al{
  display:flex;
  align-items:center;
  gap:12px;
  margin:16px 20px 0;
  padding:12px 14px;
  background:var(--sf);
  border:1px solid rgba(220,38,38,.35);
  border-left:3.5px solid var(--bad);
  border-radius:16px;
  cursor:pointer;
}
.al>div{flex:1}
.al b{font-weight:600;font-size:13px}
.al small{color:var(--mu)}
.ai{
  width:34px;
  height:34px;
  border-radius:10px;
  background:rgba(220,38,38,.1);
  color:var(--bad);
  display:grid;
  place-items:center;
  flex:none;
}

.nw{
  background:var(--tx);
  color:#fff;
  font-weight:500;
  font-size:12px;
  padding:7px 13px;
  border-radius:99px;
}
.lk{font-weight:500;font-size:12px;color:var(--mu);text-decoration:underline;text-underline-offset:3px}

/* Carrusel y Tarjeta Unificada con "Ver más..." integrado */
.car{
  display:flex;
  gap:14px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding:12px 20px 6px;
  scrollbar-width:none;
}
.car::-webkit-scrollbar{display:none}
.car .cd{flex:0 0 86%;scroll-snap-align:center}

.cd{
  position:relative;
  overflow:hidden;
  border-radius:24px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:0 12px 26px -10px rgba(31,33,36,.28);
  cursor:pointer;
  transition:transform .2s;
}
.cd:active{transform:scale(.985)}
.cd::before,.cd::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.cd::before{right:-14%;top:-32%;width:165px;height:165px;background:rgba(255,255,255,.15)}
.cd::after{left:-10%;bottom:-38%;width:135px;height:135px;background:rgba(0,0,0,.06)}
.cd>*{position:relative;z-index:1}
.cd small{color:var(--s)}
.cd.lo{box-shadow:0 0 0 2.5px #dc2626,0 12px 26px -10px rgba(31,33,36,.28)}
.cd.big2{margin:14px 20px 0;width:auto}

.cd-body{
  padding:17px 18px 14px;
  display:flex;
  flex-direction:column;
  gap:13px;
}
.tr{display:flex;align-items:center;gap:8px}
.chp{width:30px;height:21px;border-radius:5px;border:1.5px solid currentColor;opacity:.45}
.bk{margin-left:auto;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;text-align:right;opacity:.85}
.bd{background:#dc2626;color:#fff;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px}
.mid{font-size:23px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tk{height:6px;border-radius:99px;background:rgba(128,128,128,.26);margin-top:8px;overflow:hidden}
.tk i{display:block;height:100%;border-radius:99px;transition:width .5s}
.nm{font-weight:600;font-size:14px}

.cd-ft{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 18px;
  border-top:1px solid var(--bdl,rgba(0,0,0,.1));
  background:var(--ftb,rgba(0,0,0,.04));
  font-size:12px;
  font-weight:500;
}
.cd-ft span:last-child{display:inline-flex;align-items:center;gap:4px;opacity:.85}

/* Paneles, separaciones y movimientos por fecha */
.pn{
  background:var(--sf);
  border:1px solid var(--ln);
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
}
.pt{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.br{height:9px;border-radius:99px;background:var(--ln);overflow:hidden}
.br i{display:block;height:100%;background:var(--c,var(--tx));border-radius:inherit}
.lg{display:flex;justify-content:space-between;font-size:11.5px;margin-top:7px;color:var(--mu)}

.dt-grp{margin-bottom:14px}
.dt-grp:last-child{margin-bottom:0}
.dt-hd{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 4px 7px;
  margin-bottom:6px;
  border-bottom:1px solid var(--ln);
  font-size:11.5px;
  font-weight:500;
  color:var(--mu);
}
.dt-hd span:first-child{color:var(--tx);font-weight:600;text-transform:capitalize}
.mv{
  display:flex;
  gap:11px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--ln);
}
.mv:last-child{border:0;padding-bottom:2px}
.mv:first-child{padding-top:2px}
.mv .ic{
  width:36px;
  height:36px;
  border-radius:11px;
  background:var(--bg);
  border:1px solid var(--ln);
  display:grid;
  place-items:center;
  font-size:17px;
  flex:none;
}
.mv>div:nth-child(2){flex:1;min-width:0}
.mv-t{font-weight:500;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv b{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--ok)}

.st{display:flex;justify-content:space-between;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--ln)}
.st b{display:block;font-size:16px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;margin:14px 20px 0}
.pb,.sb{flex:1;border-radius:14px;padding:13px;font-weight:600;text-align:center;font-size:13px}
.pb{background:var(--ac);color:#1f2124}
.sb{background:var(--sf);border:1px solid var(--ln);color:var(--tx)}
.bk2{font-weight:500;font-size:13px;padding:14px 20px 0;display:inline-flex;align-items:center;gap:4px;color:var(--mu)}

/* Gráficos minimalistas */
.ct{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
.ct:last-child{margin-bottom:0}
.ct .br{flex:1;height:7px}
.ct span:first-child{width:102px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.fl{transform-origin:left;animation:gr .85s cubic-bezier(.22,1,.36,1) both}
@keyframes gr{from{transform:scaleX(0)}}
.cr{padding:13px 0;border-bottom:1px solid var(--ln)}
.cr:last-child{border:0;padding-bottom:2px}
.cr:first-child{padding-top:2px}
.trk{height:6px;border-radius:99px;background:var(--ln);overflow:hidden;margin:8px 0 6px}
.trk i{display:block;height:100%;border-radius:99px;background:var(--tx)}

/* Navegación inferior */
nav{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  background:var(--sf);
  border-top:1px solid var(--ln);
  padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px));
}
nav button{
  font-size:11px;
  font-weight:500;
  color:var(--mu);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
nav button span{padding:4px 18px;border-radius:99px;display:grid;transition:background .2s}
nav .on{color:var(--tx);font-weight:600}
nav .on span{background:var(--ac);color:#1f2124}

.fab{
  position:absolute;
  right:18px;
  bottom:82px;
  width:54px;
  height:54px;
  border-radius:50%;
  background:var(--tx);
  color:#fff;
  display:grid;
  place-items:center;
  box-shadow:0 10px 24px -6px rgba(0,0,0,.35);
  z-index:6;
  transition:transform .15s;
}
.fab:active{transform:scale(.93)}

/* Bottom Sheets y Formularios */
.sh{position:absolute;inset:0;background:rgba(15,17,21,.48);display:none;align-items:flex-end;z-index:10;backdrop-filter:blur(2px)}
.sh.o{display:flex}
.sc{
  position:relative;
  background:var(--sf);
  width:100%;
  border-radius:26px 26px 0 0;
  padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:92%;
  overflow-y:auto;
}
label{display:block;font-size:11.5px;font-weight:500;color:var(--mu);margin:13px 0 6px}
input,select{
  width:100%;
  padding:11px 12px;
  border-radius:12px;
  border:1px solid var(--ln);
  background:var(--bg);
  color:var(--tx);
  font:inherit;
}
.amt{font-size:28px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.chs{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:7px 12px;
  border-radius:99px;
  border:1px solid var(--ln);
  background:var(--bg);
  font-size:12.5px;
  font-weight:500;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.chip.on{
  border-color:var(--tx);
  background:var(--tx);
  color:#fff;
  font-weight:500;
}
.chip-add{
  border-style:dashed;
  border-color:var(--mu);
  color:var(--tx);
  background:transparent;
}
.tg{display:flex;background:var(--bg);border-radius:12px;padding:3px;border:1px solid var(--ln)}
.tg button{flex:1;padding:8px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--mu)}
.tg .on{background:var(--sf);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sws{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:50%;border:2.5px solid transparent}
.sw.on{border-color:var(--tx);transform:scale(1.08)}

.scn{
  position:absolute;
  inset:0;
  background:rgba(15,17,21,.84);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:500;
  border-radius:26px 26px 0 0;
  overflow:hidden;
  z-index:5;
}
.scn i{
  position:absolute;
  left:10%;
  right:10%;
  height:2px;
  background:var(--ac);
  box-shadow:0 0 14px var(--ac);
  animation:sn 1s ease-in-out infinite;
}
@keyframes sn{0%,100%{top:15%}50%{top:80%}}

.em{text-align:center;padding:30px 20px}
.em button{margin-top:12px;padding:12px 20px}
.dg{color:var(--bad);width:100%;padding:13px;margin-top:6px;font-weight:500;font-size:13px}

#tt{
  position:absolute;
  left:50%;
  bottom:88px;
  transform:translateX(-50%);
  background:var(--tx);
  color:#fff;
  padding:9px 16px;
  border-radius:99px;
  z-index:20;
  display:none;
  width:max-content;
  max-width:90%;
  font-size:12.5px;
  font-weight:500;
  box-shadow:0 8px 20px rgba(0,0,0,.22);
}
#tt button{color:var(--ac);font-weight:600;margin-left:10px}

/* Notificaciones */
.nt{padding:14px 0;border-bottom:1px solid var(--ln);display:flex;gap:10px;cursor:pointer}
.nt p{margin:6px 0 0;color:var(--mu);font-size:12.5px}
.nt .dt{width:8px;height:8px;border-radius:50%;background:#e5334b;margin-top:5px;flex:none}
.nt.rd .dt{visibility:hidden}
.nt .tl{font-weight:600}
.nt.rd .tl{font-weight:400}

/* Pantalla de carga con Moneda 3D */
#sp{
  position:absolute;
  inset:0;
  z-index:50;
  background:radial-gradient(circle at 50% 38%,#ffffff 0%,#f3f4f7 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:24px;
  transition:opacity .55s ease,transform .55s ease;
}
#sp.out{opacity:0;transform:scale(1.03);pointer-events:none}

.coin-stage{
  width:116px;
  height:116px;
  perspective:900px;
  display:grid;
  place-items:center;
}
.coin-3d{
  width:104px;
  height:104px;
  position:relative;
  transform-style:preserve-3d;
  animation:coinSpin 1.85s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes coinSpin{
  0%{transform:rotateY(-540deg) rotateX(14deg) scale(.72);opacity:0}
  20%{opacity:1}
  72%{transform:rotateY(18deg) rotateX(-4deg) scale(1.03)}
  88%{transform:rotateY(-6deg) rotateX(1deg) scale(1)}
  100%{transform:rotateY(0deg) rotateX(0deg) scale(1)}
}
.coin-face{
  position:absolute;
  inset:0;
  border-radius:50%;
  backface-visibility:hidden;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.coin-front{
  transform:translateZ(6px);
  box-shadow:0 16px 32px -10px rgba(180,130,0,.42),inset 0 0 0 2px rgba(255,255,255,.65);
}
.coin-back{
  transform:rotateY(180deg) translateZ(6px);
  box-shadow:0 16px 32px -10px rgba(180,130,0,.42);
}
.coin-edge{
  position:absolute;
  inset:1px;
  border-radius:50%;
  background:linear-gradient(135deg,#b58300,#f5c518,#9a6e00);
  backface-visibility:visible;
}
.coin-sheen{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.72) 48%,transparent 70%);
  transform:translateX(-120%);
  animation:sheenSweep 1.1s 1.45s ease-out forwards;
  pointer-events:none;
}
@keyframes sheenSweep{
  to{transform:translateX(120%)}
}
.sp-title{
  font-size:21px;
  font-weight:600;
  letter-spacing:-.01em;
  color:var(--tx);
  animation:fi .55s .9s both;
}
.sp-title span{font-weight:300;color:var(--mu)}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.ld{width:156px;height:3.5px;background:var(--ln);border-radius:9px;overflow:hidden}
.ld i{display:block;height:100%;width:0;background:var(--tx);border-radius:9px;transition:width .24s ease-out}

.coin-mini{
  width:40px;
  height:40px;
  border-radius:50%;
  display:grid;
  place-items:center;
  box-shadow:0 4px 10px -2px rgba(185,135,0,.35);
  flex:none;
}

.cat-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 12px;
  border:1px solid var(--ln);
  border-radius:12px;
  margin-bottom:8px;
  background:var(--bg);
}

/* Badges y elementos del CMS Admin */
.sync-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:10.5px;
  font-weight:500;
  padding:2px 8px;
  border-radius:99px;
  background:var(--bg);
  border:1px solid var(--ln);
  color:var(--mu);
  margin-top:3px;
}
.sync-pill i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.sync-pill.off i{background:#f59e0b}
.cms-banner{
  background:var(--tx);
  color:#fff;
  padding:7px 20px;
  font-size:11.5px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.cms-banner span{color:var(--ac);font-weight:600}
.sw-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--ln);
}
.sw-row:last-child{border:0}
.tgl{
  width:42px;
  height:24px;
  border-radius:99px;
  background:var(--ln);
  position:relative;
  transition:background .2s;
  flex:none;
}
.tgl::after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#fff;
  transition:transform .2s;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.tgl.on{background:var(--ok)}
.tgl.on::after{transform:translateX(18px)}

@media(prefers-reduced-motion:no-preference){
  .bd{animation:pl 1.6s infinite ease-in-out}
  @keyframes pl{50%{transform:scale(1.05)}}
  .sc{animation:up .24s ease-out}
  @keyframes up{from{transform:translateY(36px)}}
  #v.fx{animation:fx .28s ease-out}
  @keyframes fx{from{opacity:0;transform:translateY(8px)}}
}
</style>
</head>
<body>
<div class="ph">
  <div id="cms-bar"></div>
  <div id="v"></div>
  <button class="fab" onclick="ef()" aria-label="Registrar movimiento" id="fb"></button>
  <nav>
    <button data-v="h" onclick="go('h')"><span id="n1"></span>Inicio</button>
    <button data-v="c" onclick="go('c')"><span id="n2"></span>Gráficos</button>
    <button data-v="m" onclick="go('m')"><span id="n3"></span>Tarjetas</button>
  </nav>
  <div class="sh" id="sh" onclick="if(event.target===this)cl()"><div class="sc" id="sc"></div></div>
  <div id="tt"></div>
  <div id="sp"></div>
</div>

<!-- SDK de Firebase adaptado a tu proyecto billetera-56524 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {

      <div class="tg" style="margin:14px 0 8px">
        <button class="${BX=='in'?'on':''}" onclick="BX='in';render()">Bandeja de entrada${u?' ('+u+')':''}</button>
        <button class="${BX=='out'?'on':''}" onclick="BX='out';render()">Bandeja de salida</button>
      </div>

          <div style="flex:1;min-width:0">

              <small>${fd(x.date||x.due)}</small>

            <small>${x.box=='out'?(x.sent?'Enviada':'Programada'):x.kind}</small>
            ${x.open?`<p>${esc(x.body||'')}</p>${(x.box=='out'||IS_ADMIN)?`<button class="lk" onclick="event.stopPropagation();dn(${x.id})">Eliminar</button>`:''}`:''}

    </div>`;
  },

  c(){
    if(!S.cards.length)return empty;
    const a=S.cards.map(c=>({c,...st(c)})).sort((x,y)=>y.p-x.p),
          G=a.reduce((x,s)=>x+s.g,0),
          D=a.reduce((x,s)=>x+s.d,0),
          p=Math.round(G/Math.max(G+Math.max(D,0),1)*100),
          allCats=getCats(),
          ct=allCats.map(k=>[k,S.ex.filter(e=>e.cat.toLowerCase()===k[0].toLowerCase()&&e.amt>0).reduce((x,e)=>x+e.amt,0)]).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]),

      <div class="pn">
        ${a.map((s,i)=>`
          <div class="cr">
            <div class="rw">
              <span><span class="dot" style="background:${s.c.color}"></span>${esc(s.c.name)}</span>
              <span style="font-weight:600">${Math.round(s.p)}%</span>
            </div>
            <div class="trk"><i class="fl" style="width:${Math.min(100,s.p)}%;animation-delay:${i*.1}s${s.low?';background:#dc2626':''}"></i></div>
            <small>Gastado ${fm(s.g)} · Queda ${fm(s.d)}${s.low?' · saldo bajo':''}</small>
          </div>`).join('')}

      <h2 style="margin:22px 0 10px">En qué gastas</h2>
      <div class="pn">
        ${ct.length?ct.map((x,i)=>`

            <div class="rw">

              <span style="font-weight:600">${fm(x[1])} <small>· ${Math.round(x[1]/T*100)}%</small></span>
            </div>
            <div class="trk"><i class="fl" style="width:${x[1]/ct[0][1]*100}%;animation-delay:${i*.08}s"></i></div>

    const canAddCard=S.cms.allowUserCards||IS_ADMIN;

      <div class="rw">
        <h1>Tarjetas</h1>

      </div>
    </div>`;
  }
};

function render(){
  sync();
  $('#cms-bar').innerHTML=IS_ADMIN?`
    <div class="cms-banner">
      <div>Modo Admin: <span>${ADMIN_USER}</span></div>
      <div style="display:flex;gap:12px">
        <button style="color:var(--ac);font-weight:600" onclick="openCms()">Configurar CMS</button>
        <button style="opacity:.8" onclick="logoutAdmin()">Salir</button>
      </div>
    </div>`:'';
  const y=$('#v').scrollTop;
  $('#v').innerHTML=VW[V]();
  $('#v').scrollTop=y;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==(V=='d'||V=='n'?'h':V)));
}

function go(v,id){
  V=v;
  ID=id||null;
  const e=$('#v');
  e.classList.remove('fx');
  void e.offsetWidth;
  e.classList.add('fx');
  render();
  e.scrollTop=0;
}

function rs(){
  if(rs.t){
    const keepCms=S.cms;
    S=seed();
    S.cms=keepCms;
    save();
    render();
    rs.t=0;
    toast('Datos de ejemplo restaurados');
  }else{
    rs.t=1;
    toast('Toca otra vez para restaurar los datos de ejemplo');
    setTimeout(()=>rs.t=0,3000);
  }
}

function pick(el){
  if(!el.firstElementChild)return;
  const w=el.firstElementChild.offsetWidth+14,
        c=S.cards[Math.round(el.scrollLeft/w)];
  if(c&&c.id!=S.act){
    S.act=c.id;
  }
}

function sheet(h){
  $('#sc').innerHTML=h;
  $('#sh').classList.add('o');
}
function cl(){
  $('#sh').classList.remove('o');
}

function toast(m,u){
  const t=$('#tt');
  t.innerHTML=esc(m)+(u?`<button onclick="un(${u})">Deshacer</button>`:'');
  t.style.display='block';
  clearTimeout(t.h);
  t.h=setTimeout(()=>t.style.display='none',4000);
}
function un(id){
  S.ex=S.ex.filter(e=>e.id!=id);
  save();
  render();
  $('#tt').style.display='none';
}

  sheet(`

    render();

  IS_ADMIN=false;

/* Edición / Eliminación de movimientos (Corrección básica para Admin) */
function editTx(id){
  const tx=S.ex.find(x=>x.id==id);
  if(!tx)return;
  F={
    editId:tx.id,
    card:tx.card,
    cat:tx.cat,
    neg:tx.amt>=0?1:0,
    amt:String(Math.abs(tx.amt)),
    note:tx.note||'',
    date:new Date(tx.date).toISOString().slice(0,10)
  };
  editTxForm();
}

function editTxForm(){
  const allCats=getCats();
  sheet(`
    <h2 style="font-size:17px;margin-bottom:12px">Editar movimiento</h2>
    <div class="tg">
      <button class="${F.neg?'on':''}" onclick="F.neg=1;editTxForm()">Gasto</button>
      <button class="${F.neg?'':'on'}" onclick="F.neg=0;editTxForm()">Abono o reembolso</button>
    </div>
    <label>Tarjeta</label>
    <div class="chs">${S.cards.map(c=>`<button class="chip ${F.card==c.id?'on':''}" onclick="F.card=${c.id};editTxForm()">${esc(c.name)}</button>`).join('')}</div>
    <label>Categoría</label>
    <div class="chs">${allCats.map(([n,i])=>`<button class="chip ${F.cat===n?'on':''}" onclick="F.cat=${JSON.stringify(n)};editTxForm()">${i} ${esc(n)}</button>`).join('')}</div>
    <label>Monto</label>
    <input class="amt" inputmode="decimal" value="${esc(F.amt)}" oninput="F.amt=this.value">
    <div style="display:grid;grid-template-columns:1fr 1.2fr;gap:10px;margin-top:4px">
      <div>
        <label>Fecha</label>
        <input type="date" value="${esc(F.date)}" oninput="F.date=this.value">
      </div>
      <div>
        <label>Nota</label>
        <input value="${esc(F.note)}" oninput="F.note=this.value">
      </div>
    </div>
    <div class="row" style="margin:18px 0 0">
      <button class="sb" onclick="cl()">Cancelar</button>
      <button class="pb" onclick="saveEditTx()">Actualizar</button>
    </div>
    <button class="dg" onclick="delTx(${F.editId})">Eliminar movimiento</button>
  `);
}

function saveEditTx(){
  const a=parseFloat(String(F.amt).replace(',','.'));
  if(!(a>0))return toast('Ingresa un monto válido');
  const idx=S.ex.findIndex(x=>x.id==F.editId);
  if(idx>=0){
    S.ex[idx]={
      id:F.editId,
      card:F.card,
      cat:F.cat,
      amt:F.neg?a:-a,
      note:(F.note||'').trim(),
      date:F.date?new Date(F.date+'T12:00:00').toISOString():S.ex[idx].date
    };
    save();
    cl();
    render();
    toast('Movimiento actualizado');
  }
}

function delTx(id){
  S.ex=S.ex.filter(x=>x.id!=id);
  save();
  cl();
  render();
  toast('Movimiento eliminado');
}

  F={
    card:id||(S.cards.find(c=>c.id==S.act)||S.cards[0]).id,
    cat:'Comida',
    neg:1,
    amt:'',
    note:'',
    date:new Date().toISOString().slice(0,10)

  efr();
}

    <label>Tarjeta</label>
    <div class="chs">${S.cards.map(c=>`<button class="chip ${F.card==c.id?'on':''}" onclick="F.card=${c.id};efr()">${esc(c.name)}</button>`).join('')}</div>

    <div class="rw" style="margin-top:13px;margin-bottom:6px">
      <label style="margin:0">Categoría</label>
      <button class="lk" onclick="catMgr()">Gestionar (${S.customCats.length})</button>
    </div>
    <div class="chs">
      ${allCats.map(([n,i])=>`<button class="chip ${F.cat===n?'on':''}" onclick="F.cat=${JSON.stringify(n)};efr()">${i} ${esc(n)}</button>`).join('')}
      <button class="chip chip-add" onclick="newCatForm()">+ Categoría</button>
    </div>

    <label>Monto (${esc(S.cms.currency||'USD')})</label>
    <input class="amt" inputmode="decimal" placeholder="0.00" value="${esc(F.amt)}" oninput="F.amt=this.value">
    <div class="chs" style="margin-top:8px">
      ${[5,10,20,50].map(v=>`<button class="chip" onclick="F.amt='${v}';efr()">$${v}</button>`).join('')}
      ${S.cms.allowScan?`<button class="chip" onclick="sn()">${ic('s',15)} Escanear ticket</button>`:''}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1.2fr;gap:10px;margin-top:4px">
      <div>
        <label>Fecha</label>
        <input type="date" value="${esc(F.date)}" oninput="F.date=this.value">
      </div>
      <div>
        <label>Nota (opcional)</label>
        <input placeholder="Ej. Almuerzo" value="${esc(F.note)}" oninput="F.note=this.value">
      </div>
    </div>

    <div class="row" style="margin:18px 0 0">
      <button class="sb" onclick="cl()">Cancelar</button>
      <button class="pb" onclick="sx()">Confirmar</button>
    </div>
  `);
}

function newCatForm(){
  F.ncName=F.ncName||'';
  F.ncEmoji=F.ncEmoji||'🏷️';
  const quickEmojis=['☕','🐶','🎮','📚','✈️','💅','🏋️','🎁','👶','🔧','🌿','🎵'];
  sheet(`
    <h2 style="font-size:17px;margin-bottom:4px">Nueva categoría</h2>
    <small>Escribe el nombre y elige o escribe un emoji desde tu teclado</small>

    <div style="display:grid;grid-template-columns:76px 1fr;gap:10px;margin-top:8px">
      <div>
        <label>Emoji</label>
        <input id="ce_in" maxlength="4" style="text-align:center;font-size:22px;padding:8px" value="${esc(F.ncEmoji)}" oninput="F.ncEmoji=this.value">
      </div>
      <div>
        <label>Nombre de categoría</label>
        <input id="cn_in" placeholder="Ej. Mascotas, Café, Gym" value="${esc(F.ncName)}" oninput="F.ncName=this.value">
      </div>
    </div>

    <label>Sugerencias rápidas de emoji (o usa tu teclado)</label>
    <div class="chs">
      ${quickEmojis.map(em=>`<button class="chip ${F.ncEmoji===em?'on':''}" style="font-size:16px;padding:6px 10px" onclick="F.ncEmoji='${em}';$('#ce_in').value='${em}'">${em}</button>`).join('')}
    </div>

    <div class="row" style="margin:18px 0 0">
      <button class="sb" onclick="efr()">Volver</button>
      <button class="pb" onclick="saveNewCat()">Guardar categoría</button>
    </div>
  `);
  setTimeout(()=>{const inp=$('#cn_in');if(inp)inp.focus()},120);
}

function saveNewCat(){
  const name=(F.ncName||'').trim();
  const emoji=(F.ncEmoji||'').trim()||'🏷️';
  if(!name)return toast('Escribe un nombre para la categoría');
  if(getCats().some(c=>c[0].toLowerCase()===name.toLowerCase())){
    return toast('Esa categoría ya existe');
  }
  S.customCats.push([name,emoji,'#2c2a29']);
  F.cat=name;
  F.ncName='';
  F.ncEmoji='🏷️';
  save();
  toast('Categoría "'+name+'" agregada');
  efr();
}

function catMgr(){
  sheet(`
    <h2 style="font-size:17px;margin-bottom:4px">Categorías personalizadas</h2>
    <small>Aquí puedes ver o eliminar las categorías que has creado</small>
    <div style="margin-top:14px">
      ${S.customCats.length
        ? S.customCats.map((c,i)=>`
          <div class="cat-row">
            <span><b style="font-size:16px;margin-right:6px">${c[1]}</b> ${esc(c[0])}</span>
            <button class="lk" style="color:var(--bad)" onclick="delCat(${i})">Eliminar</button>
          </div>`).join('')
        : '<p style="text-align:center;color:var(--mu);padding:22px 0">Aún no has creado categorías propias.</p>'
      }
    </div>
    <div class="row" style="margin:16px 0 0">
      <button class="sb" onclick="efr()">Volver</button>
      <button class="pb" onclick="newCatForm()">+ Crear categoría</button>
    </div>
  `);
}

function delCat(idx){
  S.customCats.splice(idx,1);
  save();
  catMgr();
  toast('Categoría eliminada');
}

function sn(){
  F.sc=1;
  efr();
  setTimeout(()=>{
    const t=[
      ['Súper',34.8,'Super Selectos Express'],
      ['Comida',14.5,'Almuerzo ejecutivo'],
      ['Transporte',22,'Gasolinera'],
      ['Salud',18.75,'Farmacia']
    ][Math.floor(Math.random()*4)];
    F.sc=0;
    F.neg=1;
    F.cat=t[0];
    F.amt=String(t[1]);
    F.note=t[2];
    efr();
    toast('Ticket escaneado y autocompletado');
  },950);
}

function sx(){
  const a=parseFloat(String(F.amt).replace(',','.'));
  if(!(a>0))return toast('Ingresa un monto mayor a cero');
  const chosenDate=F.date
    ? new Date(F.date+'T12:00:00').toISOString()
    : new Date().toISOString();
  const e={
    id:Date.now(),
    card:F.card,
    cat:F.cat,
    amt:F.neg?a:-a,
    note:(F.note||'').trim(),
    date:chosenDate
  };
  S.ex.push(e);
  save();
  cl();
  render();
  const c=S.cards.find(x=>x.id==F.card);
  toast(st(c).low?'⚠ Balance bajo en '+c.name:'Movimiento registrado',e.id);
}

function pvu(){
  const g=i=>$('#'+i).value;
  $('#pv').innerHTML=card({
    id:F.id,
    name:g('fn')||'Nombre de la tarjeta',
    bank:g('fb')||'Banco',
    type:g('ft'),
    color:F.color,
    d0:parseFloat(g('fd').replace(',','.'))||0,
    thr:parseFloat(g('fp'))||20
  },'nc',false);
}
function pc(el,h){
  F.color=h;
  document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s===el));
  pvu();
}
function cf(id){
  const c=S.cards.find(x=>x.id==id)||{};
  F={id:c.id,color:c.color||PAL[0][1]};
  sheet(`
    <h2 style="font-size:17px;margin-bottom:12px">${c.id?'Editar tarjeta':'Nueva tarjeta'}</h2>
    <div id="pv" style="margin:0 -2px"></div>
    <label>Nombre</label>
    <input id="fn" oninput="pvu()" value="${esc(c.name||'')}" placeholder="Ej. Visa Oro Compras">
    <label>Banco</label>
    <input id="fb" oninput="pvu()" value="${esc(c.bank||'')}" placeholder="Ej. Banco Agrícola">
    <label>Tipo</label>
    <select id="ft" onchange="pvu()">
      <option value="debito" ${c.type=='debito'?'selected':''}>Débito o prepago (saldo)</option>
      <option value="credito" ${c.type=='credito'?'selected':''}>Crédito (límite disponible)</option>
    </select>
    <label>Saldo o límite disponible (${esc(S.cms.currency||'USD')})</label>
    <input id="fd" oninput="pvu()" inputmode="decimal" value="${c.d0??''}" placeholder="0.00">
    <label>Avisar cuando quede el (%)</label>
    <input id="fp" oninput="pvu()" inputmode="numeric" value="${c.thr??(S.cms.defaultThr||20)}">
    <label>Color</label>
    <div class="sws">${PAL.map(p=>`<button class="sw ${p[1]==F.color?'on':''}" style="background:${p[1]}" aria-label="${p[0]}" title="${p[0]}" onclick="pc(this,'${p[1]}')"></button>`).join('')}</div>
    <div class="row" style="margin:16px 0 0">
      <button class="sb" onclick="cl()">Cancelar</button>
      <button class="pb" onclick="sc2()">Guardar tarjeta</button>
    </div>
    ${c.id?`<button class="dg" onclick="if(this.dataset.s){dd(${c.id})}else{this.dataset.s=1;this.textContent='¿Seguro? Toca otra vez para eliminar'}">Eliminar tarjeta</button>`:''}
  `);
  pvu();
}
function sc2(){
  const n=$('#fn').value.trim(),
        d=parseFloat($('#fd').value.replace(',','.')),
        p=parseFloat($('#fp').value)||(S.cms.defaultThr||20);
  if(!n||!(d>=0))return toast('Escribe un nombre y un saldo válido');
  const o={
    id:F.id||Date.now(),
    name:n,
    bank:$('#fb').value.trim()||'Banco',
    type:$('#ft').value,
    color:F.color,
    d0:d,
    thr:Math.min(100,Math.max(0,p))
  };
  const i=S.cards.findIndex(c=>c.id==o.id);
  i>=0?S.cards[i]=o:S.cards.push(o);
  save();
  cl();
  render();
}
function dd(id){
  S.cards=S.cards.filter(c=>c.id!=id);
  S.ex=S.ex.filter(e=>e.card!=id);
  if(V=='d')V='h';
  save();
  cl();
  render();
}

render();

/* Pantalla de carga con Moneda 3D giratoria */
(function(){
  const sp=$('#sp');
  let edges='';
  for(let z=-5;z<=5;z++){
    edges+=`<div class="coin-edge" style="transform:translateZ(${z}px)"></div>`;
  }
  sp.innerHTML=`
    <div class="coin-stage">
      <div class="coin-3d">
        ${edges}
        <div class="coin-face coin-back">${COIN_BACK(104)}</div>
        <div class="coin-face coin-front">
          ${COIN_FRONT(104,'sp')}
          <div class="coin-sheen"></div>
        </div>
      </div>
    </div>
    <div style="text-align:center">
      <div class="sp-title">${esc(S.cms.appName||'Billfold Digital')}</div>
      <small id="sl" style="display:block;margin-top:4px">Preparando tu billetera…</small>
    </div>
    <div class="ld"><i id="sb"></i></div>
  `;

  let p=0;
  const iv=setInterval(()=>{
    p=Math.min(100,p+7+Math.random()*12);
    $('#sb').style.width=p+'%';
    $('#sl').textContent=p<42?'Cargando tus tarjetas…':p<82?'Organizando saldos y alertas…':'Listo, '+(S.cms.userName||'Valeria');
    if(p>=100){
      clearInterval(iv);
      setTimeout(()=>{
        sp.classList.add('out');
        setTimeout(()=>sp.remove(),560);
      },420);
    }
  },250);
})();
</script>
</body>
</html>
