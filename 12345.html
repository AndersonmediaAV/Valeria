<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,interactive-widget=resizes-content">
<title>Billfold Digital</title>
<link rel="apple-touch-icon" href="aaa.jfif?v=4">
<meta name="theme-color" content="#f6f7f9">
<link rel="icon" href="aaa.jfif?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Billfold Digital">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;
  --sf:#ffffff;
  --tx:#1f2124;
  --mu:#6b7280;
  --ln:#e6e8ec;
  --ac:#fdda24;
  --ok:#00b37e;
  --bad:#dc2626;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  height:100%;
  background:var(--bg);
  color:var(--tx);
  font:400 13.5px/1.45 "Inter",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tx);outline-offset:2px}

.ph{
  position:relative;
  max-width:420px;
  height:100%;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg);
}
@media(min-width:500px){
  body{display:grid;place-items:center;background:#dfe3ea}
  .ph{
    width:392px;
    height:min(844px,94vh);
    border-radius:42px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.35),0 0 0 10px #1f1e1d;
  }
}

#v{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:28px}
#v::-webkit-scrollbar{display:none}

h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
small{font-size:11.5px;color:var(--mu);font-weight:400}

.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec{padding:0 20px;margin-top:20px}

.hd{
  background:var(--sf);
  padding:14px 20px 20px;
  border-bottom:1px solid var(--ln);
}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lgo{display:flex;align-items:center;gap:11px;min-width:0}
.lgo>div:last-child{min-width:0}
.lgo h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-acts{display:flex;align-items:center;gap:8px;flex:none}
.ib{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--bg);
  border:1px solid var(--ln);
  display:grid;
  place-items:center;
  transition:transform .15s,background .15s;
}
.ib:active{transform:scale(.94)}
.bell{position:relative}
.bn{
  position:absolute;
  top:-3px;
  right:-3px;
  min-width:17px;
  height:17px;
  border-radius:9px;
  background:#e5334b;
  color:#fff;
  font-size:10px;
  font-weight:600;
  display:grid;
  place-items:center;
  padding:0 4px;
  box-shadow:0 2px 6px rgba(229,51,75,.35);
}

.gl{
  background:var(--sf);
  color:var(--tx);
  border:1px solid var(--ln);
  border-radius:20px;
  padding:16px;
}
.tag{
  font-size:11px;
  font-weight:500;
  color:var(--tx);
  padding:3px 10px;
  border-radius:99px;
  border:1px solid var(--ln);
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--d,var(--ok))}
.gb{font-size:26px;font-weight:600;color:var(--tx);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rt{text-align:right}
.rt b{display:block;font-weight:500;font-variant-numeric:tabular-nums}
.sp{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--ln);margin:12px 0 7px}
.sp i{background:var(--tx);transition:width .5s ease}

.al{
  display:flex;
  align-items:center;
  gap:12px;
  margin:16px 20px 0;
  padding:12px 14px;
  background:var(--sf);
  border:1px solid rgba(220,38,38,.35);
  border-left:3.5px solid var(--bad);
  border-radius:16px;
  cursor:pointer;
}
.al>div{flex:1}
.al b{font-weight:600;font-size:13px}
.al small{color:var(--mu)}
.ai{
  width:34px;
  height:34px;
  border-radius:10px;
  background:rgba(220,38,38,.1);
  color:var(--bad);
  display:grid;
  place-items:center;
  flex:none;
}

.nw{
  background:var(--tx);
  color:#fff;
  font-weight:500;
  font-size:12px;
  padding:7px 13px;
  border-radius:99px;
}
.lk{font-weight:500;font-size:12px;color:var(--mu);text-decoration:underline;text-underline-offset:3px}

.car{
  display:flex;
  gap:14px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding:12px 20px 6px;
  scrollbar-width:none;
}
.car::-webkit-scrollbar{display:none}
.car .cd{flex:0 0 86%;scroll-snap-align:center}

.cd{
  position:relative;
  overflow:hidden;
  border-radius:24px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:0 12px 26px -10px rgba(31,33,36,.28);
  cursor:pointer;
  transition:transform .2s;
}
.cd:active{transform:scale(.985)}
.cd::before,.cd::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.cd::before{right:-14%;top:-32%;width:165px;height:165px;background:rgba(255,255,255,.15)}
.cd::after{left:-10%;bottom:-38%;width:135px;height:135px;background:rgba(0,0,0,.06)}
.cd>*{position:relative;z-index:1}
.cd small{color:var(--s)}
.cd.lo{box-shadow:0 0 0 2.5px #dc2626,0 12px 26px -10px rgba(31,33,36,.28)}
.cd.big2{margin:14px 20px 0;width:auto}

.cd-body{
  padding:17px 18px 14px;
  display:flex;
  flex-direction:column;
  gap:13px;
}
.tr{display:flex;align-items:center;gap:8px}
.chp{width:30px;height:21px;border-radius:5px;border:1.5px solid currentColor;opacity:.45}
.bk{margin-left:auto;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;text-align:right;opacity:.85}
.bd{background:#dc2626;color:#fff;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px}
.mid{font-size:23px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tk{height:6px;border-radius:99px;background:rgba(128,128,128,.26);margin-top:8px;overflow:hidden}
.tk i{display:block;height:100%;border-radius:99px;transition:width .5s}
.nm{font-weight:600;font-size:15px}

.cd-ft{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 18px;
  border-top:1px solid var(--bdl,rgba(0,0,0,.1));
  background:var(--ftb,rgba(0,0,0,.04));
  font-size:12px;
  font-weight:500;
}
.cd-ft span:last-child{display:inline-flex;align-items:center;gap:4px;opacity:.85}

.pn{
  background:var(--sf);
  border:1px solid var(--ln);
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
}
.br{height:9px;border-radius:99px;background:var(--ln);overflow:hidden}
.br i{display:block;height:100%;background:var(--c,var(--tx));border-radius:inherit}
.lg{display:flex;justify-content:space-between;font-size:11.5px;margin-top:7px;color:var(--mu)}

.dt-grp{margin-bottom:14px}
.dt-grp:last-child{margin-bottom:0}
.dt-hd{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 4px 7px;
  margin-bottom:6px;
  border-bottom:1px solid var(--ln);
  font-size:11.5px;
  font-weight:500;
  color:var(--mu);
}
.dt-hd span:first-child{color:var(--tx);font-weight:600;text-transform:capitalize}
.mv{
  display:flex;
  gap:11px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--ln);
}
.mv:last-child{border:0;padding-bottom:2px}
.mv:first-child{padding-top:2px}
.mv .ic{
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--bg);
  border:1px solid var(--ln);
  display:grid;
  place-items:center;
  font-size:17px;
  flex:none;
  transition:transform .15s,border-color .15s;
}
.mv .ic:active{transform:scale(.92);border-color:var(--tx)}
.mv-info{flex:1;min-width:0;cursor:pointer}
.mv-t{font-weight:500;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv b{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--ok)}

.st{display:flex;justify-content:space-between;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--ln)}
.st b{display:block;font-size:16px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;margin:14px 20px 0}
.pb,.sb{flex:1;border-radius:14px;padding:13px;font-weight:600;text-align:center;font-size:13px}
.pb{background:var(--ac);color:#1f2124}
.sb{background:var(--sf);border:1px solid var(--ln);color:var(--tx)}
.bk2{font-weight:500;font-size:13px;padding:14px 20px 0;display:inline-flex;align-items:center;gap:4px;color:var(--mu)}

.ct{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
.ct:last-child{margin-bottom:0}
.ct .br{flex:1;height:7px}
.ct span:first-child{width:102px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.fl{transform-origin:left;animation:gr .85s cubic-bezier(.22,1,.36,1) both}
@keyframes gr{from{transform:scaleX(0)}}
.cr{padding:13px 0;border-bottom:1px solid var(--ln)}
.cr:last-child{border:0;padding-bottom:2px}
.cr:first-child{padding-top:2px}
.trk{height:6px;border-radius:99px;background:var(--ln);overflow:hidden;margin:8px 0 6px}
.trk i{display:block;height:100%;border-radius:99px;background:var(--tx)}

/* Navegación inferior de 4 pestañas con Registrar integrado */
nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:var(--sf);
  border-top:1px solid var(--ln);
  padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px));
}
nav button{
  font-size:11px;
  font-weight:500;
  color:var(--mu);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
nav button span{padding:4px 14px;border-radius:99px;display:grid;transition:background .2s}
nav .on{color:var(--tx);font-weight:600}
nav .on span{background:var(--ac);color:#1f2124}
nav .reg-btn span{background:var(--tx);color:#fff}
nav .reg-btn{color:var(--tx);font-weight:600}

.sh{position:absolute;inset:0;background:rgba(15,17,21,.48);display:none;align-items:flex-end;z-index:10;backdrop-filter:blur(2px)}
.sh.o{display:flex}
.sc{
  position:relative;
  background:var(--sf);
  width:100%;
  border-radius:26px 26px 0 0;
  padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:92%;
  overflow-y:auto;
}
label{display:block;font-size:11.5px;font-weight:500;color:var(--mu);margin:13px 0 6px}
input,select{
  width:100%;
  padding:11px 12px;
  border-radius:12px;
  border:1px solid var(--ln);
  background:var(--bg);
  color:var(--tx);
  font:inherit;
}
.amt{font-size:28px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.chs{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:7px 12px;
  border-radius:99px;
  border:1px solid var(--ln);
  background:var(--bg);
  font-size:12.5px;
  font-weight:500;
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.chip.on{
  border-color:var(--tx);
  background:var(--tx);
  color:#fff;
  font-weight:500;
}
.chip-add{
  border-style:dashed;
  border-color:var(--mu);
  color:var(--tx);
  background:transparent;
}
.tg{display:flex;background:var(--bg);border-radius:12px;padding:3px;border:1px solid var(--ln)}
.tg button{flex:1;padding:8px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--mu)}
.tg .on{background:var(--sf);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sws{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:50%;border:2.5px solid transparent}
.sw.on{border-color:var(--tx);transform:scale(1.08)}

.scn{
  position:absolute;
  inset:0;
  background:rgba(15,17,21,.84);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:500;
  border-radius:26px 26px 0 0;
  overflow:hidden;
  z-index:5;
}
.scn i{
  position:absolute;
  left:10%;
  right:10%;
  height:2px;
  background:var(--ac);
  box-shadow:0 0 14px var(--ac);
  animation:sn 1s ease-in-out infinite;
}
@keyframes sn{0%,100%{top:15%}50%{top:80%}}

.em{text-align:center;padding:30px 20px}
.em button{margin-top:12px;padding:12px 20px}
.dg{color:var(--bad);width:100%;padding:13px;margin-top:6px;font-weight:500;font-size:13px}

#tt{
  position:absolute;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  background:var(--tx);
  color:#fff;
  padding:9px 16px;
  border-radius:99px;
  z-index:20;
  display:none;
  width:max-content;
  max-width:90%;
  font-size:12.5px;
  font-weight:500;
  box-shadow:0 8px 20px rgba(0,0,0,.22);
}
#tt button{color:var(--ac);font-weight:600;margin-left:10px}

.nt{padding:14px 0;border-bottom:1px solid var(--ln);display:flex;gap:10px;cursor:pointer}
.nt p{margin:6px 0 0;color:var(--mu);font-size:12.5px}
.nt .dt{width:8px;height:8px;border-radius:50%;background:#e5334b;margin-top:5px;flex:none}
.nt.rd .dt{visibility:hidden}
.nt .tl{font-weight:600}
.nt.rd .tl{font-weight:400}

#sp{
  position:absolute;
  inset:0;
  z-index:50;
  background:radial-gradient(circle at 50% 38%,#ffffff 0%,#f3f4f7 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:24px;
  transition:opacity .55s ease,transform .55s ease;
}
#sp.out{opacity:0;transform:scale(1.03);pointer-events:none}

.coin-stage{
  width:116px;
  height:116px;
  perspective:900px;
  display:grid;
  place-items:center;
}
.coin-3d{
  width:104px;
  height:104px;
  position:relative;
  transform-style:preserve-3d;
  animation:coinSpin 1.85s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes coinSpin{
  0%{transform:rotateY(-540deg) rotateX(14deg) scale(.72);opacity:0}
  20%{opacity:1}
  72%{transform:rotateY(18deg) rotateX(-4deg) scale(1.03)}
  88%{transform:rotateY(-6deg) rotateX(1deg) scale(1)}
  100%{transform:rotateY(0deg) rotateX(0deg) scale(1)}
}
.coin-face{
  position:absolute;
  inset:0;
  border-radius:50%;
  backface-visibility:hidden;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.coin-front{
  transform:translateZ(6px);
  box-shadow:0 16px 32px -10px rgba(180,130,0,.42),inset 0 0 0 2px rgba(255,255,255,.65);
}
.coin-back{
  transform:rotateY(180deg) translateZ(6px);
  box-shadow:0 16px 32px -10px rgba(180,130,0,.42);
}
.coin-edge{
  position:absolute;
  inset:1px;
  border-radius:50%;
  background:linear-gradient(135deg,#b58300,#f5c518,#9a6e00);
  backface-visibility:visible;
}
.coin-sheen{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.72) 48%,transparent 70%);
  transform:translateX(-120%);
  animation:sheenSweep 1.1s 1.45s ease-out forwards;
  pointer-events:none;
}
@keyframes sheenSweep{
  to{transform:translateX(120%)}
}
.sp-title{
  font-size:21px;
  font-weight:600;
  letter-spacing:-.01em;
  color:var(--tx);
  animation:fi .55s .9s both;
}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.ld{width:156px;height:3.5px;background:var(--ln);border-radius:9px;overflow:hidden}
.ld i{display:block;height:100%;width:0;background:var(--tx);border-radius:9px;transition:width .24s ease-out}

.coin-mini{
  width:40px;
  height:40px;
  border-radius:50%;
  display:grid;
  place-items:center;
  box-shadow:0 4px 10px -2px rgba(185,135,0,.35);
  flex:none;
}

.cat-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 12px;
  border:1px solid var(--ln);
  border-radius:12px;
  margin-bottom:8px;
  background:var(--bg);
}

.sync-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:10.5px;
  font-weight:500;
  padding:2px 8px;
  border-radius:99px;
  background:var(--bg);
  border:1px solid var(--ln);
  color:var(--mu);
}
.sync-pill i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.sync-pill.off i{background:#f59e0b}

@media(prefers-reduced-motion:no-preference){
  .bd{animation:pl 1.6s infinite ease-in-out}
  @keyframes pl{50%{transform:scale(1.05)}}
  .sc{animation:up .24s ease-out}
  @keyframes up{from{transform:translateY(36px)}}
  #v.fx{animation:fx .28s ease-out}
  @keyframes fx{from{opacity:0;transform:translateY(8px)}}
}

html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
*{touch-action:manipulation}
:root{padding-bottom:0}
.ph{height:100vh;height:var(--h,100dvh)}
@media(min-width:500px) and (min-height:640px){.ph{height:min(844px,94vh)}}
@media(min-width:500px) and (max-height:639px){body{display:block;background:var(--bg)}.ph{width:100%;max-width:520px;border-radius:0;box-shadow:none;height:var(--h,100vh)}}
input,select{font-size:16px}
.sc{overscroll-behavior:contain}
.chip{min-height:36px}
.cd{border:1px solid rgba(0,0,0,.1)}
.sws{grid-template-columns:repeat(5,1fr);gap:10px}
.sw{border:2.5px solid rgba(0,0,0,.14)}
.stk{position:sticky;bottom:-1px;background:var(--sf);padding:12px 0 2px;margin-bottom:0!important}
nav{grid-template-columns:repeat(5,1fr);align-items:end;position:relative;z-index:5}
nav .reg-btn{margin-top:-30px}
nav .reg-btn span{width:58px;height:58px;padding:0;place-items:center;border-radius:50%;background:var(--tx);color:#fff;box-shadow:0 8px 18px -4px rgba(31,33,36,.5),0 0 0 5px var(--sf);transition:transform .15s}
nav .reg-btn:active span{transform:scale(.92)}
</style>

<body>
<div class="ph">
  <div id="v"></div>
  <nav>
    <button data-v="h" onclick="go('h')"><span id="n1"></span>Inicio</button>
    <button data-v="c" onclick="go('c')"><span id="n2"></span>Gráficos</button>
    <button data-v="r" class="reg-btn" onclick="ef()" aria-label="Registrar movimiento"><span id="n4"></span>Registrar</button>

  <div class="sh" id="sh" onclick="if(event.target===this)cl()"><div class="sc" id="sc"></div></div>

</div>

    storageBucket: "billetera-56524.firebasestorage.app",
    messagingSenderId: "591903343088",
    appId: "1:591903343088:web:c44ebb59d6a7808ffddd35",
    measurementId: "G-CCHQJ0D676"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const stateRef = doc(db, "billfold_cms", "app_state");
    let isRemoteUpdate = false;

    window.FB_SYNC = {
      connected: false,
      push(stateObj) {
        if (isRemoteUpdate) return;
        try {
          const cleanData = JSON.parse(JSON.stringify(stateObj));
          cleanData.customCats = (cleanData.customCats || []).map(c => Array.isArray(c) ? {n:c[0], e:c[1], c:c[2]} : c);
          cleanData._updatedAt = new Date().toISOString();
          setDoc(stateRef, cleanData).catch(err => console.warn("Sync pendiente:", err));
        } catch (err) { console.warn("Sync no disponible:", err); }
      }
    };

    const rev = d => d ? (d._rev || Date.parse(d._updatedAt) || 0) : 0;
    const take = d => {
      if (d && d.cards && rev(d) > rev(window.getAppState())) {
        isRemoteUpdate = true; window.applyRemoteState(d); isRemoteUpdate = false;
      }
    };
    getDoc(stateRef).then(snap => {
      if (snap.exists() && snap.data().cards) {
        take(snap.data());
        if (rev(window.getAppState()) > rev(snap.data())) window.FB_SYNC.push(window.getAppState());
      } else window.FB_SYNC.push(window.getAppState());
    }).catch(() => {});

    onSnapshot(stateRef, (snap) => {
      window.FB_SYNC.connected = true;
      if (snap.metadata.hasPendingWrites || snap.metadata.fromCache) return;
      take(snap.data());
    }, () => { window.FB_SYNC.connected = false; });
  } catch (e) {
    console.warn("Modo local activo:", e);
  }
</script>

}
function dateLabel(iso){

  c(){
    if(!S.cards.length)return empty;

            </div>
            <div class="trk"><i class="fl" style="width:${Math.min(100,s.p)}%;animation-delay:${i*.1}s${s.low?';background:#dc2626':''}"></i></div>
            <small>Gastado ${fm(s.g)} · Queda ${fm(s.d)}${s.low?' · saldo bajo':''}</small>

      <div class="pn">
        <div class="rw" style="margin-bottom:6px">

        </div>
        <small>Tus datos se respaldan automáticamente en la nube y en tu teléfono.</small>
        <button type="button" class="dg" onclick="if(this.dataset.s){S.cards=[];S.ex=[];S.notes=[];S.ak={};S.adj=0;save();render()}else{this.dataset.s=1;this.textContent='¿Seguro? Toca otra vez para borrar todo'}">Empezar de cero</button>

function render(){
  sync();
  const y=$('#v').scrollTop;
  $('#v').innerHTML=VW[V]();
  $('#v').scrollTop=y;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==(V=='d'?'h':V)));
}

let SK=0,BK=null;
function go(v,id,pop){
  if(!pop){
    const t=history.state||{};
    if(v=='h'){if(t.v&&t.v!='h'){SK=1;setTimeout(()=>SK=0,500);history.back()}}
    else if(t.v=='h'||!t.v)history.pushState({v,id},'');
    else history.replaceState({v,id},'');
  }
  V=v;ID=id||null;
  const e=$('#v');
  e.classList.remove('fx');void e.offsetWidth;e.classList.add('fx');
  render();
  e.scrollTop=0;
}

function rs(){
  if(rs.t){
    S=seed();
    save();
    render();
    rs.t=0;
    toast('Datos de ejemplo restaurados');
  }else{
    rs.t=1;
    toast('Toca otra vez para restaurar los datos de ejemplo');
    setTimeout(()=>rs.t=0,3000);
  }
}

function pick(el){
  if(!el.firstElementChild)return;
  const w=el.firstElementChild.offsetWidth+14,
        c=S.cards[Math.round(el.scrollLeft/w)];
  if(c&&c.id!=S.act){
    S.act=c.id;
  }
}

const hide=()=>$('#sh').classList.remove('o');
function sheet(h,b){
  const o=$('#sh');
  if(!o.classList.contains('o'))history.pushState({sh:1},'');
  BK=b||null;
  $('#sc').innerHTML=h;
  o.classList.add('o');
}
function cl(){
  const was=$('#sh').classList.contains('o');
  hide();BK=null;
  if(was&&history.state&&history.state.sh){SK=1;setTimeout(()=>SK=0,500);history.back()}
}

function toast(m,u){
  const t=$('#tt');
  t.innerHTML=esc(m)+(u?`<button type="button" onclick="un(${u})">Deshacer</button>`:'');
  t.style.display='block';
  clearTimeout(t.h);
  t.h=setTimeout(()=>t.style.display='none',4000);
}
function un(id){
  S.ex=S.ex.filter(e=>e.id!=id);
  save();
  render();
  $('#tt').style.display='none';
}

/* =========================================================

function editTx(id){
  const tx=S.ex.find(x=>x.id==id);
  if(!tx)return;
  F={
    editId:tx.id,
    card:tx.card,
    cat:tx.cat,
    neg:tx.amt>=0?1:0,
    amt:String(Math.abs(tx.amt)),
    note:tx.note||'',
    date:new Date(tx.date).toISOString().slice(0,10)
  };
  editTxForm();
}

function editTxForm(){
  const allCats=getCats();
  sheet(`
    <h2 style="font-size:17px;margin-bottom:12px">Editar movimiento</h2>
    <div class="tg">
      <button type="button" class="${F.neg?'on':''}" onclick="F.neg=1;editTxForm()">Gasto</button>
      <button type="button" class="${F.neg?'':'on'}" onclick="F.neg=0;editTxForm()">Ingresos</button>
    </div>
    <label>Tarjeta (Banco)</label>
    <div class="chs">${S.cards.map(c=>`<button type="button" class="chip ${F.card==c.id?'on':''}" onclick="F.card=${c.id};editTxForm()">${esc(cardTitle(c))}</button>`).join('')}</div>
    <label>Categoría</label>
    <div class="chs">${allCats.map(([n,i],idx)=>`<button type="button" class="chip ${F.cat===n?'on':''}" onclick="F.cat=getCats()[${idx}][0];editTxForm()">${i} ${esc(n)}</button>`).join('')}</div>
    <label>Monto (USD)</label>
    <input class="amt" inputmode="decimal" value="${esc(F.amt)}" oninput="F.amt=this.value">
    <div style="display:block">
      <div>
        <label>Fecha</label>
        <input type="date" value="${esc(F.date)}" oninput="F.date=this.value">
      </div>
      <div>
        <label>Nota</label>
        <input value="${esc(F.note)}" oninput="F.note=this.value">
      </div>
    </div>
    <div class="row" style="margin:18px 0 0">
      <button type="button" class="sb" onclick="cl()">Cancelar</button>
      <button type="button" class="pb" onclick="saveEditTx()">Guardar cambios</button>
    </div>
    <button type="button" class="dg" onclick="delTx(${F.editId})">Eliminar movimiento</button>
  `);
}

function saveEditTx(){
  const a=parseFloat(String(F.amt).replace(',','.'));
  if(!(a>0))return toast('Ingresa un monto válido');
  const idx=S.ex.findIndex(x=>x.id==F.editId);
  if(idx>=0){
    S.ex[idx]={
      id:F.editId,
      card:F.card,
      cat:F.cat,
      amt:F.neg?a:-a,
      note:(F.note||'').trim(),
      date:F.date?new Date(F.date+'T12:00:00').toISOString():S.ex[idx].date
    };
    save();
    cl();
    render();
    toast('Movimiento actualizado');
  }
}

function delTx(id){
  S.ex=S.ex.filter(x=>x.id!=id);
  save();
  cl();
  render();
  toast('Movimiento eliminado');
}

const ld=k=>{const d=new Date(Date.now()-864e5*k);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const gv=i=>{const e=$('#'+i);return e?e.value:null};
function grab(){const a=gv('xa'),n=gv('xn'),d=gv('xd');if(a!==null)F.amt=a;if(n!==null)F.note=n;if(d!==null)F.date=d}
function pk(k,v,el){F[k]=v;el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el))}
function pkc(i,el){pk('cat',getCats()[i][0],el)}
function tgn(v){F.neg=v;document.querySelectorAll('#sc .tg button').forEach((b,i)=>b.classList.toggle('on',i==(v?0:1)))}
function sd(k){$('#xd').value=ld(k);F.date=ld(k)}
function ef(id){
  if(!S.cards.length){go('m');return toast('Primero agrega una tarjeta')}
  F={card:id||(S.cards.find(c=>c.id==S.act)||S.cards[0]).id,cat:'Comida',neg:1,amt:'',note:'',date:''};
  efr();
}
function efr(open){
  grab();
  if(!getCats().some(c=>c[0]==F.cat))F.cat='Otros';
  sheet(`
    <div class="rw" style="margin-bottom:12px"><h2 style="font-size:17px">Registrar movimiento</h2><button type="button" class="ib" style="width:32px;height:32px" aria-label="Cerrar" onclick="cl()">✕</button></div>
    <div class="tg"><button type="button" class="${F.neg?'on':''}" onclick="tgn(1)">Gasto</button><button type="button" class="${F.neg?'':'on'}" onclick="tgn(0)">Ingreso</button></div>
    <label>Monto (USD)</label>
    <input id="xa" class="amt" inputmode="decimal" placeholder="0.00" value="${esc(F.amt)}">
    <div class="chs" style="margin-top:8px">${[5,10,20,50].map(v=>`<button type="button" class="chip" onclick="$('#xa').value='${v}'">$${v}</button>`).join('')}</div>
    <label>Tarjeta</label>
    <div class="chs">${S.cards.map(c=>`<button type="button" class="chip ${F.card==c.id?'on':''}" onclick="pk('card',${c.id},this)">${esc(cardTitle(c))}</button>`).join('')}</div>
    <div class="rw" style="margin:13px 0 6px"><label style="margin:0">Categoría</label><button type="button" class="lk" onclick="catMgr()">Gestionar (${S.customCats.length})</button></div>
    <div class="chs">${getCats().map(([n,i],x)=>`<button type="button" class="chip ${F.cat===n?'on':''}" onclick="pkc(${x},this)">${i} ${esc(n)}</button>`).join('')}<button type="button" class="chip chip-add" onclick="const b=$('#ac');b.style.display=b.style.display=='block'?'none':'block';$('#an').focus()">+ Nueva</button></div>
    <div id="ac" style="display:none;margin-top:10px;padding:10px;border:1px dashed var(--mu);border-radius:14px">
      <div style="display:grid;grid-template-columns:64px 1fr;gap:8px"><input id="ae" maxlength="4" value="🏷️" aria-label="Emoji" style="text-align:center;font-size:20px;padding:8px"><input id="an" placeholder="Nombre. Ej. Mascotas" maxlength="24"></div>
      <button type="button" class="pb" style="width:100%;margin-top:8px" onclick="addCat()">Añadir categoría</button>
    </div>
    <label>Fecha (obligatoria)</label>
    <input id="xd" type="date" value="${esc(F.date)}" required>
    <div class="chs" style="margin-top:8px"><button type="button" class="chip" onclick="sd(0)">Hoy</button><button type="button" class="chip" onclick="sd(1)">Ayer</button></div>
    <label>Nota (opcional)</label>
    <input id="xn" placeholder="Ej. Almuerzo" value="${esc(F.note)}">
    <div class="row stk"><button type="button" class="sb" onclick="cl()">Cancelar</button><button type="button" class="pb" onclick="sx()">Confirmar</button></div>
  `);
  if(open){$('#ac').style.display='block';$('#an').focus()}
}
function addCat(){
  const n=(gv('an')||'').trim(),e=(gv('ae')||'').trim()||'🏷️';
  if(!n)return toast('Escribe un nombre para la categoría');
  if(getCats().some(c=>c[0].toLowerCase()==n.toLowerCase()))return toast('Esa categoría ya existe');
  S.customCats.push([n,e,'#2c2a29']);
  F.cat=n;save();efr();
  toast('Categoría "'+n+'" creada y seleccionada');
}

function catMgr(){
  const sheet=h=>window.sheet(h,efr);
  sheet(`
    <h2 style="font-size:17px;margin-bottom:4px">Categorías personalizadas</h2>
    <small>Aquí puedes ver o eliminar las categorías que has creado</small>
    <div style="margin-top:14px">
      ${S.customCats.length
        ? S.customCats.map((c,i)=>`
          <div class="cat-row">
            <span><b style="font-size:16px;margin-right:6px">${c[1]}</b> ${esc(c[0])}</span>
            <button type="button" class="lk" style="color:var(--bad)" onclick="delCat(${i})">Eliminar</button>
          </div>`).join('')

      }
    </div>
    <div class="row" style="margin:16px 0 0">
      <button type="button" class="sb" onclick="efr()">Volver</button>
      <button type="button" class="pb" onclick="efr(1)">+ Crear categoría</button>
    </div>

function delCat(idx){

  if(!getCats().some(c=>c[0]==F.cat))F.cat='Comida';
  save();
  catMgr();
  toast('Categoría eliminada');

function tot(){
  const a=S.cards.filter(c=>c.type!='credito').map(st),
        db=a.reduce((x,t)=>x+t.d,0);
  return{db,D:db+(+S.adj||0),G:a.reduce((x,t)=>x+t.g,0)};

function eb(){
  sheet(`
    <div class="rw" style="margin-bottom:6px"><h2 style="font-size:17px">Editar balance total</h2><button type="button" class="ib" style="width:32px;height:32px" aria-label="Cerrar" onclick="cl()">✕</button></div>

  `);
}
function sbt(){
  const v=parseFloat(String(gv('bt')).replace(',','.'));
  if(!(v>=0)){toast('Escribe un monto válido');return $('#bt').focus()}
  S.adj=Math.round((v-tot().db)*100)/100;
  save();cl();render();
  toast('Balance total actualizado');
}
function sx(){
  grab();
  const a=parseFloat(String(F.amt).replace(',','.'));
  if(!(a>0)){toast('Ingresa un monto mayor a cero');return $('#xa').focus()}
  if(!F.date){toast('Elige la fecha del movimiento');return $('#xd').focus()}
  const e={id:Date.now(),card:F.card,cat:F.cat||'Otros',amt:F.neg?a:-a,note:(F.note||'').trim(),date:new Date(F.date+'T12:00:00').toISOString()};
  S.ex.push(e);
  save();cl();render();
  const c=S.cards.find(x=>x.id==F.card);
  toast(c&&st(c).low?'⚠ Saldo bajo en '+cardTitle(c):'Movimiento registrado',e.id);
}

const BANKS=['Banco Agrícola','Banco Cuscatlán','BAC Credomatic','Davivienda El Salvador'];
function pvu(){
  const d=parseFloat(String(gv('fd')).replace(',','.'))||0;
  $('#pv').innerHTML=card({id:F.id,bank:F.bank||'Banco',type:F.type,color:F.color,d0:d,thr:F.thr,cut:parseInt(gv('fcu'))||'',pay:parseInt(gv('fpa'))||''},'nc',false);
  $('#th').textContent=d>0?`Te avisaré cuando te queden ${fm(d*F.thr/100)} o menos (${F.thr}% de ${fm(d)}).`:'Escribe arriba el saldo o límite para ver el monto exacto.';
}
const on1=(el,sel)=>el.parentNode.querySelectorAll(sel).forEach(c=>c.classList.toggle('on',c===el));
function pkb(i,el){F.bank=F.bl[i];on1(el,'.chip');pvu()}
function pt(v,el){F.type=v;on1(el,'button');pvu()}
function pth(v,el){F.thr=v;on1(el,'.chip');pvu()}
function pc(el,h,n){F.color=h;on1(el,'.sw');$('#cnm').textContent=n;pvu()}
function addBank(){
  const n=(gv('nb')||'').trim();
  if(!n)return toast('Escribe el nombre del banco');
  let i=F.bl.findIndex(x=>x.toLowerCase()==n.toLowerCase());
  if(i<0){
    F.bl.push(n);i=F.bl.length-1;
    S.customBanks=[...(S.customBanks||[]),n];save();
    const b=document.createElement('button');
    b.type='button';b.className='chip';b.textContent=n;b.onclick=function(){pkb(i,this)};
    $('#bk').insertBefore(b,$('#bk .chip-add'));
  }
  pkb(i,$('#bk').children[i]);
  $('#ob').style.display='none';$('#nb').value='';
}
function cf(id){
  const c=S.cards.find(x=>x.id==id)||{};
  F={id:c.id,color:c.color||PAL[3][1],bank:c.bank||'',type:c.type||'debito',thr:c.thr??20};
  F.bl=[...BANKS,...(S.customBanks||[])];
  if(F.bank&&!F.bl.includes(F.bank))F.bl.push(F.bank);
  const pn=(PAL.find(p=>p[1]==F.color)||['Personalizado'])[0];
  sheet(`
    <h2 style="font-size:17px;margin-bottom:12px">${c.id?'Editar tarjeta':'Nueva tarjeta'}</h2>
    <div id="pv" style="margin:0 -2px"></div>
    <label>Banco</label>
    <div class="chs" id="bk">${F.bl.map((b,i)=>`<button type="button" class="chip ${F.bank===b?'on':''}" onclick="pkb(${i},this)">${esc(b)}</button>`).join('')}<button type="button" class="chip chip-add" onclick="const o=$('#ob');o.style.display=o.style.display=='block'?'none':'block';$('#nb').focus()">+ Otro banco</button></div>
    <div id="ob" style="display:none;margin-top:8px"><div style="display:flex;gap:8px"><input id="nb" placeholder="Nombre del banco" maxlength="30"><button type="button" class="pb" style="flex:none;padding:0 16px" onclick="addBank()">Añadir</button></div></div>
    <label>Tipo de tarjeta</label>
    <div class="tg"><button type="button" class="${F.type=='debito'?'on':''}" onclick="pt('debito',this)">Débito</button><button type="button" class="${F.type=='credito'?'on':''}" onclick="pt('credito',this)">Crédito</button></div>
    <label>Saldo o límite disponible (USD)</label>
    <input id="fd" oninput="pvu()" inputmode="decimal" value="${c.d0??''}" placeholder="0.00">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><label>Día de corte</label><input id="fcu" oninput="pvu()" inputmode="numeric" maxlength="2" placeholder="Ej. 15" value="${c.cut||''}"></div>
      <div><label>Día de pago</label><input id="fpa" oninput="pvu()" inputmode="numeric" maxlength="2" placeholder="Ej. 5" value="${c.pay||''}"></div>
    </div>
    <small style="display:block;margin-top:6px">Corte: el día del mes en que se suma todo lo que gastaste. Pago: el día en que debes pagar. Opcional.</small>
    <label>Avisarme cuando me quede poco</label>
    <div class="chs">${[10,20,30,50].map(v=>`<button type="button" class="chip ${F.thr==v?'on':''}" onclick="pth(${v},this)">${v}%</button>`).join('')}</div>
    <small id="th" style="display:block;margin-top:6px;color:var(--tx);font-weight:500"></small>
    <small style="display:block;margin-top:4px">Usamos porcentaje para que sirva con cualquier monto: 20% significa que te aviso cuando te quede la quinta parte de tu dinero.</small>
    <label>Color: <b id="cnm" style="color:var(--tx)">${pn}</b></label>
    <div class="sws">${PAL.map(p=>`<button type="button" class="sw ${p[1]==F.color?'on':''}" style="background:${p[1]}" aria-label="${p[0]}" onclick="pc(this,'${p[1]}','${p[0]}')"></button>`).join('')}</div>
    <div class="row stk" style="margin:16px 0 0">
      <button type="button" class="sb" onclick="cl()">Cancelar</button>
      <button type="button" class="pb" onclick="sc2()">Guardar tarjeta</button>
    </div>
    ${c.id?`<button type="button" class="dg" onclick="if(this.dataset.s){dd(${c.id})}else{this.dataset.s=1;this.textContent='¿Seguro? Toca otra vez para eliminar'}">Eliminar tarjeta</button>`:''}
  `);
  pvu();
}
function sc2(){
  const b=(F.bank||'').trim(),d=parseFloat(String(gv('fd')).replace(',','.'));
  if(!b)return toast('Elige un banco');
  if(!(d>=0))return toast('Escribe el saldo o límite disponible');
  const cu=(gv('fcu')||'').trim(),pa=(gv('fpa')||'').trim(),ok=v=>v===''||(/^\d{1,2}$/.test(v)&&+v>=1&&+v<=31);
  if(!ok(cu)||!ok(pa))return toast('El día de corte y el de pago deben ser del 1 al 31');
  const o={id:F.id||Date.now(),bank:b,type:F.type,color:F.color,d0:d,thr:F.thr,cut:cu?+cu:'',pay:pa?+pa:''};
  const i=S.cards.findIndex(c=>c.id==o.id);
  i>=0?S.cards[i]=o:S.cards.push(o);
  save();cl();render();
}
function dd(id){
  S.cards=S.cards.filter(c=>c.id!=id);
  S.ex=S.ex.filter(e=>e.card!=id);
  if(V=='d')V='h';
  save();
  cl();
  render();
}

history.replaceState({v:'h'},'');
const vh=()=>document.documentElement.style.setProperty('--h',(window.visualViewport?visualViewport.height:innerHeight)+'px');
vh();addEventListener('resize',vh);
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{vh();scrollTo(0,0)});
document.addEventListener('mousedown',e=>{if(e.target.closest('#sc button'))e.preventDefault()});
addEventListener('popstate',e=>{
  if(SK){SK=0;return}
  if($('#sh').classList.contains('o')){
    if(BK){const f=BK;BK=null;history.pushState({sh:1},'');f()}else hide();
    return;
  }
  const t=e.state||{};
  go(t.v||'h',t.id,1);
});
const reload=()=>{try{const l=JSON.parse(localStorage.getItem('radar'));if(l&&l.cards&&(l._rev||0)>(S._rev||0)){S=l;S.customCats=S.customCats||[];render()}}catch(_){}};
addEventListener('pageshow',e=>{if(e.persisted)reload()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)reload()});

render();

(function(){
  const sp=$('#sp');
  let edges='';
  for(let z=-5;z<=5;z++){
    edges+=`<div class="coin-edge" style="transform:translateZ(${z}px)"></div>`;
  }
  sp.innerHTML=`
    <div class="coin-stage">
      <div class="coin-3d">
        ${edges}
        <div class="coin-face coin-back">${COIN_BACK(104)}</div>
        <div class="coin-face coin-front">
          ${COIN_FRONT(104,'sp')}
          <div class="coin-sheen"></div>
        </div>
      </div>
    </div>
    <div style="text-align:center">
      <div class="sp-title">Billfold Digital</div>
      <small id="sl" style="display:block;margin-top:4px">Preparando tu billetera…</small>
    </div>
    <div class="ld"><i id="sb"></i></div>
  `;

  let p=0;
  const iv=setInterval(()=>{
    p=Math.min(100,p+7+Math.random()*12);
    $('#sb').style.width=p+'%';
    $('#sl').textContent=p<42?'Cargando tus tarjetas…':p<82?'Organizando saldos y alertas…':'Listo, '+(S.userName||'Valeria');
    if(p>=100){
      clearInterval(iv);
      setTimeout(()=>{
        sp.classList.add('out');
        setTimeout(()=>sp.remove(),560);
      },420);
    }
  },250);
})();
</script>
</body>
</html>
